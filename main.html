<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Servicio Técnico</title>
  <!-- Tailwind CSS para diseño adaptable a celulares -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Biblioteca para captura de firma táctil -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <!-- Biblioteca para generación de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
</head>
<body class="bg-gray-100 p-4 min-h-screen">
  <div id="reporte" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md space-y-4">
    <h1 class="text-xl font-bold text-center text-slate-800 border-b pb-2">Reporte de Servicio Técnico</h1>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase">Cliente / Empresa:</label>
      <input type="text" id="cliente" class="w-full border p-2 rounded-lg mt-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase">Diagnóstico / Trabajos Realizados:</label>
      <textarea id="descripcion" class="w-full border p-2 rounded-lg mt-1 text-sm focus:ring-2 focus:ring-blue-500 outline-none" rows="3"></textarea>
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase">Evidencia Fotográfica:</label>
      <input type="file" id="fotos" accept="image/*" capture="environment" multiple class="w-full mt-1 text-xs text-gray-500 file:mr-2 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-blue-50 file:text-blue-700">
    </div>

    <div>
      <label class="block text-xs font-semibold text-gray-600 uppercase mb-1">Firma de Conformidad:</label>
      <div class="border rounded-lg bg-gray-50">
        <canvas id="canvasFirma" class="w-full h-32 touch-none"></canvas>
      </div>
      <button type="button" onclick="limpiarFirma()" class="text-xs text-red-500 font-medium mt-1">Limpiar firma</button>
    </div>

    <button onclick="generarPDF()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition">
      Generar y Guardar Reporte PDF
    </button>
  </div>

  <script>
    const canvas = document.getElementById('canvasFirma');
    const signaturePad = new SignaturePad(canvas);

    function ajustarCanvas() {
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
    }
    window.addEventListener("resize", ajustarCanvas);
    ajustarCanvas();

    function limpiarFirma() { signaturePad.clear(); }

    function generarPDF() {
      const elemento = document.getElementById('reporte');
      const opciones = {
        margin:       0.4,
        filename:     `reporte_${new Date().toISOString().slice(0,10)}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2 },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };
      html2pdf().set(opciones).from(elemento).save();
    }
  </script>
</body>
</html>

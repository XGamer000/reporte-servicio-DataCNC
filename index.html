<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bitácora de Servicio Técnico</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firma táctil -->
  <script src="https://cdn.jsdelivr.net/npm/signature_pad@4.0.0/dist/signature_pad.umd.min.js"></script>
  <!-- Generación de PDF -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  
  <style>
    /* Conversión de colores CMYK a HEX para CSS Web */
    :root {
      --color-oscuro: #2A3A39; /* C:73 M:53 Y:60 K:42 */
      --color-claro: #90A894;  /* C:45 M:25 Y:45 K:2 */
    }
    .bg-cmyk-dark { background-color: var(--color-oscuro); }
    .text-cmyk-dark { color: var(--color-oscuro); }
    .border-cmyk-dark { border-color: var(--color-oscuro); }
    
    .bg-cmyk-light { background-color: var(--color-claro); }
    .text-cmyk-light { color: var(--color-claro); }
    .border-cmyk-light { border-color: var(--color-claro); }
  </style>
</head>
<body class="bg-cmyk-light p-3 min-h-screen text-slate-800">
  <div id="reporte" class="max-w-md mx-auto bg-white p-5 rounded-2xl shadow-xl space-y-4">
    
    <!-- Encabezado -->
    <div class="border-b-2 border-cmyk-dark pb-2 text-center">
      <h1 class="text-xl font-black text-cmyk-dark tracking-wide uppercase">Reporte de Servicio Técnico</h1>
    </div>

    <!-- Fecha con Calendario -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase">Fecha del Servicio:</label>
      <input type="date" id="fecha" class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none font-medium">
    </div>

    <!-- Datos del Cliente -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase">Cliente / Empresa:</label>
      <input type="text" id="cliente" placeholder="Nombre de la empresa" class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none">
    </div>

    <!-- Menú Desplegable: Tipo de Maquinaria -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase">Tipo de Maquinaria:</label>
      <select id="tipoMaquina" class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none font-medium">
        <option value="" disabled selected>Seleccione una opción...</option>
        <option value="Soldadora laser">Soldadora laser</option>
        <option value="Laser de corte">Laser de corte</option>
        <option value="Laser de corte Rotativo">Laser de corte Rotativo</option>
        <option value="Limpiadora de cordones">Limpiadora de cordones</option>
        <option value="Router">Router</option>
        <option value="Co2">Co2</option>
        <option value="Dobladora nc">Dobladora nc</option>
        <option value="Horno">Horno</option>
        <option value="Pintura electrostatica">Pintura electrostatica</option>
      </select>
    </div>

    <!-- Marca y Descripción de la Máquina -->
    <div class="grid grid-cols-1 gap-3">
      <div>
        <label class="block text-xs font-bold text-cmyk-dark uppercase">Marca de la Máquina:</label>
        <input type="text" id="marca" placeholder="Ej. Bodor, Raycus, etc." class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none">
      </div>
      <div>
        <label class="block text-xs font-bold text-cmyk-dark uppercase">Descripción Rápida de la Máquina:</label>
        <input type="text" id="descMaquina" placeholder="Ej. 1500W, Doble mesa, Cabezal automático" class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none">
      </div>
    </div>

    <!-- Diagnóstico / Trabajos Realizados -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase">Diagnóstico / Trabajos Realizados:</label>
      <textarea id="descripcion" placeholder="Detalle las pruebas o reparaciones hechas..." class="w-full border-2 border-gray-200 p-2 rounded-lg mt-1 text-sm bg-gray-50 focus:border-cmyk-dark focus:bg-white outline-none" rows="3"></textarea>
    </div>

    <!-- Evidencia Fotográfica -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase">Evidencia Fotográfica:</label>
      <input type="file" id="fotos" accept="image/*" capture="environment" multiple onchange="mostrarFotos(event)" class="no-pdf w-full mt-1 text-xs text-slate-500 file:mr-2 file:py-2 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-bold file:bg-cmyk-light file:text-cmyk-dark">
      <div id="galeria" class="grid grid-cols-2 gap-2 mt-2"></div>
    </div>

    <!-- ======================================================= -->
    <!-- PARTE MEDIA: LOGO DE LA EMPRESA                         -->
    <!-- ======================================================= -->
  

    <!-- Firma de Conformidad -->
    <div>
      <label class="block text-xs font-bold text-cmyk-dark uppercase mb-1">Firma de Conformidad:</label>
      <div class="border-2 border-gray-200 rounded-xl bg-gray-50 overflow-hidden">
        <canvas id="canvasFirma" class="w-full h-32 touch-none"></canvas>
      </div>
      <button type="button" onclick="limpiarFirma()" class="no-pdf text-xs text-red-500 font-bold mt-1">Limpiar firma</button>
    </div>

    <!-- Botón de Generar y Guardar PDF -->
    <button id="btnGuardar" onclick="generarPDF()" class="no-pdf w-full bg-cmyk-dark text-white py-3 rounded-xl font-bold hover:opacity-95 transition shadow-lg text-sm tracking-wide">
      Generar y Guardar Reporte PDF
    </button>
  </div>

  <script>
    // =========================================================================
    // PEGA AQUÍ LA URL DE TU APLICACIÓN WEB DE GOOGLE APPS SCRIPT
    // =========================================================================
    const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbxNFO3Cr2HRUHfPooMjYabB0PncVvTsFVea9cbmet7P481ZZ6lLAEPKURxQn9IHY-z3Cw/exec ";

    // Asignar fecha actual por defecto en el calendario
    document.getElementById('fecha').valueAsDate = new Date();

    const canvas = document.getElementById('canvasFirma');
    const signaturePad = new SignaturePad(canvas);

    function ajustarCanvas() {
      const data = signaturePad.toData();
      const ratio = Math.max(window.devicePixelRatio || 1, 1);
      canvas.width = canvas.offsetWidth * ratio;
      canvas.height = canvas.offsetHeight * ratio;
      canvas.getContext("2d").scale(ratio, ratio);
      signaturePad.clear();
      signaturePad.fromData(data);
    }
    window.addEventListener("resize", ajustarCanvas);
    ajustarCanvas();

    function limpiarFirma() { signaturePad.clear(); }

    function mostrarFotos(e) {
      const galeria = document.getElementById('galeria');
      galeria.innerHTML = '';
      Array.from(e.target.files).forEach(file => {
        const reader = new FileReader();
        reader.onload = (event) => {
          const img = document.createElement('img');
          img.src = event.target.result;
          img.className = 'w-full h-24 object-cover rounded-lg border';
          galeria.appendChild(img);
        };
        reader.readAsDataURL(file);
      });
    }

    function cargarLogo(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          const imgLogo = document.getElementById('previewLogo');
          imgLogo.src = e.target.result;
          imgLogo.classList.remove('hidden');
        }
        reader.readAsDataURL(file);
      }
    }

    async function generarPDF() {
      const clienteInput = document.getElementById('cliente').value.trim();
      const fechaInput = document.getElementById('fecha').value;

      if (!clienteInput) {
        alert("Por favor, ingresa el nombre del cliente o empresa.");
        return;
      }

      const btnGenerar = document.getElementById('btnGuardar');
      const textoOriginalBtn = btnGenerar.innerText;
      btnGenerar.disabled = true;
      btnGenerar.innerText = "⏳ Generando PDF y respaldando...";

      const elemento = document.getElementById('reporte');
      const elementosOcultar = elemento.querySelectorAll('.no-pdf');
      
      // Ocultar botones e inputs interactivos para que no aparezcan en el PDF
      elementosOcultar.forEach(el => el.style.display = 'none');

      const opciones = {
        margin:       0.3,
        filename:     `reporte_${clienteInput.replace(/[^a-zA-Z0-9]/g, '_')}_${fechaInput}.pdf`,
        image:        { type: 'jpeg', quality: 0.98 },
        html2canvas:  { scale: 2, useCORS: true },
        jsPDF:        { unit: 'in', format: 'letter', orientation: 'portrait' }
      };

      try {
        // 1. Crear instancia de html2pdf
        const worker = html2pdf().set(opciones).from(elemento);

        // 2. Generar el PDF como ArrayBuffer en memoria para el envío a la nube
        const pdfArrayBuffer = await worker.output('arraybuffer');

        // 3. Descargar copia local directamente en el dispositivo móvil
        await worker.save();

        // 4. Si la URL de Apps Script está configurada, respaldar en la nube
        if (URL_APPS_SCRIPT && URL_APPS_SCRIPT !== "PEGA_AQUI_TU_URL_DE_APPS_SCRIPT") {
          const pdfBase64 = arrayBufferToBase64(pdfArrayBuffer);

          const payload = {
            fecha: fechaInput,
            cliente: clienteInput,
            tipoMaquina: document.getElementById('tipoMaquina').value,
            marca: document.getElementById('marca').value,
            descMaquina: document.getElementById('descMaquina').value,
            descripcion: document.getElementById('descripcion').value,
            pdfBase64: pdfBase64
          };

          await fetch(URL_APPS_SCRIPT, {
            method: "POST",
            mode: "no-cors",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(payload)
          });

          alert("✅ Reporte descargado localmente y respaldado en Google Drive / Sheets.");
        } else {
          alert("✅ PDF descargado localmente.\n(Recuerda configurar la URL de Apps Script para respaldar en la nube).");
        }

      } catch (error) {
        console.error("Error procesando reporte:", error);
        alert("⚠️ El PDF se generó, pero hubo un detalle en la conexión con la nube.");
      } finally {
        // Restaurar botones de la interfaz
        elementosOcultar.forEach(el => el.style.display = '');
        btnGenerar.disabled = false;
        btnGenerar.innerText = textoOriginalBtn;
      }
    }

    // Función auxiliar para convertir el buffer binario del PDF a Base64
    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      for (let i = 0; i < bytes.byteLength; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }
  </script>
</body>
</html>
